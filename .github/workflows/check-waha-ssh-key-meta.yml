name: Check WAHA SSH key meta
on:
  repository_dispatch:
    types: [check-waha-ssh-key-meta]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Key meta
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: bash scripts/check-waha-ssh-key-meta.sh
