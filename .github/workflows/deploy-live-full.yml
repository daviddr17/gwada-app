# Einziger Full-Deploy-Einstieg: ruft dieselben Workflows wie Superadmin / gh auf.
# Kein duplizierter Build-/Migrate-Code — Drift zwischen full und einzeln vermieden.

name: Deploy live (full)

on:
  workflow_dispatch:
    inputs:
      force_unlock:
        description: Hängenden VPS-Deploy beenden (Lock + Prozess) und neu starten
        required: false
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - .github/triggers/deploy-live.env

concurrency:
  group: deploy-live-full
  cancel-in-progress: false

jobs:
  db:
    name: Live DB
    uses: ./.github/workflows/deploy-live-db.yml
    with:
      ref: ${{ github.sha }}
    secrets: inherit

  app:
    name: Live App
    needs: db
    uses: ./.github/workflows/deploy-live-app.yml
    with:
      ref: ${{ github.sha }}
      force_unlock: ${{ inputs.force_unlock == true }}
    secrets: inherit
