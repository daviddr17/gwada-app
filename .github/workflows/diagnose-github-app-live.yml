name: Diagnose GitHub App live
on:
  workflow_dispatch:
  repository_dispatch:
    types: [diagnose-github-app-live]
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose container GitHub App mint
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: bash scripts/diagnose-github-app-live.sh
