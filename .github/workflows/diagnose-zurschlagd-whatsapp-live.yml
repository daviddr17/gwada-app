name: Diagnose zurschlagd WhatsApp live

on:
  workflow_dispatch:
  repository_dispatch:
    types: [diagnose-zurschlagd-whatsapp-live]

concurrency:
  group: diagnose-zurschlagd-whatsapp-live
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${LIVE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${LIVE_VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Diagnose WhatsApp row + WAHA servers
        env:
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          export GWADA_SSH_IDENTITY=~/.ssh/id_ed25519
          export GWADA_SSH_BATCH=1
          export LIVE_VPS_HOST
          bash scripts/run-live-sql-ci.sh scripts/diagnose-zurschlagd-whatsapp-live.sql

      - name: Probe WAHA session via app container
        env:
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@${LIVE_VPS_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          cid=$(docker ps --format '{{.Names}}' | grep d3cg1b54arvue2tcm8u34qty- | head -1)
          echo "container=$cid"
          docker exec "$cid" node -e '
          const base=(process.env.SUPABASE_UPSTREAM_URL||process.env.NEXT_PUBLIC_SUPABASE_URL||"").replace(/\/$/,"");
          const key=process.env.SUPABASE_SERVICE_ROLE_KEY||"";
          if(!base||!key){console.error("missing env"); process.exit(1);}
          const h={apikey:key,Authorization:"Bearer "+key,Accept:"application/json"};
          (async()=>{
            const r=await fetch(base+"/rest/v1/restaurants?slug=eq.zurschlagd&select=id,slug",{headers:h});
            const rest=await r.json();
            console.log("restaurant", JSON.stringify(rest));
            const rid=rest[0]?.id;
            if(!rid) process.exit(1);
            const i=await fetch(base+"/rest/v1/restaurant_integrations?restaurant_id=eq."+rid+"&integration_key=eq.whatsapp&select=status,phone_number,waha_session_name,waha_server_id,last_error,updated_at",{headers:h});
            console.log("integration", await i.text());
            const s=await fetch(base+"/rest/v1/waha_servers?select=id,name,base_url,enabled,accept_new_sessions&order=sort_order",{headers:h});
            console.log("waha_servers", await s.text());
          })().catch(e=>{console.error(e); process.exit(1);});
          '
          REMOTE
