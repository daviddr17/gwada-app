name: Diagnose zurschlagd WhatsApp live

on:
  workflow_dispatch:
  repository_dispatch:
    types: [diagnose-zurschlagd-whatsapp-live]

concurrency:
  group: diagnose-zurschlagd-whatsapp-live
  cancel-in-progress: false

jobs:
  apply-deposit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup SSH
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${LIVE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${LIVE_VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Apply deposit migration on the live app database
        env:
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 -o BatchMode=yes \
            supabase/migrations/20260929163306_reservation_deposit_settings.sql \
            "root@${LIVE_VPS_HOST}:/tmp/reservation-deposit-settings.sql"
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@${LIVE_VPS_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          name="supabase-db-oogd5syyxiqb1k4g0wy1u9n8"
          cid="$(docker ps -q --filter "name=${name}" | head -1)"
          actual="$(docker inspect -f '{{.Name}}' "${cid}" 2>/dev/null || true)"
          if [[ "${actual}" != "/${name}" ]]; then
            echo "Container ${name} nicht gefunden (actual=${actual})."
            docker ps --format '{{.Names}}'
            exit 1
          fi
          if [[ -z "${cid}" ]]; then
            echo "Container ${name} nicht gefunden."
            docker ps --format '{{.Names}}'
            exit 1
          fi
          ip="$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}} {{end}}' "${cid}")"
          echo "container=${name} ip=${ip}"
          docker exec -i "${cid}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < /tmp/reservation-deposit-settings.sql
          docker exec -i "${cid}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "NOTIFY pgrst, 'reload schema';"
          docker exec -i "${cid}" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
            "select column_name from information_schema.columns where table_schema = 'public' and table_name = 'restaurant_reservation_settings' and column_name like 'deposit_%' order by 1;"
          rm -f /tmp/reservation-deposit-settings.sql
          REMOTE
