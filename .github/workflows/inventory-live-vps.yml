# Read-only Inventur Live-VPS (Coolify / Traefik / App / Supabase).
# Push auf cursor/** triggert Inventur (Agent oft ohne workflow_dispatch).
name: Inventory live VPS

on:
  workflow_dispatch:
  push:
    branches:
      - "cursor/**"
    paths:
      - "scripts/vps-inventory-coolify-live.sh"
      - ".github/workflows/inventory-live-vps.yml"
      - "deploy/live/**"

concurrency:
  group: inventory-live-vps
  cancel-in-progress: true

jobs:
  inventory:
    name: SSH inventory (no secrets dumped)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Inventory via LIVE_SSH_KEY
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "${LIVE_SSH_KEY}" ] || [ -z "${LIVE_VPS_HOST}" ]; then
            echo "::error::LIVE_SSH_KEY / LIVE_VPS_HOST fehlen in GitHub Repository Secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${LIVE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${LIVE_VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          export GWADA_SSH_IDENTITY=~/.ssh/id_ed25519
          export GWADA_SSH_BATCH=1
          export LIVE_VPS_HOST
          chmod +x scripts/vps-inventory-coolify-live.sh
          bash scripts/vps-inventory-coolify-live.sh | tee /tmp/gwada-live-inventory.txt

      - name: Upload inventory artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwada-live-inventory
          path: /tmp/gwada-live-inventory.txt
          retention-days: 14
