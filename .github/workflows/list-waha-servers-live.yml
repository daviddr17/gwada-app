name: List WAHA servers live
on:
  workflow_dispatch:
  repository_dispatch:
    types: [list-waha-servers-live]
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Query waha_servers on VPS
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${LIVE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${LIVE_VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@${LIVE_VPS_HOST}" bash -s <<'REMOTE'
          set -euo pipefail
          # Prefer querying via app container env → supabase
          cid=$(docker ps --format '{{.Names}}' | grep d3cg1b54arvue2tcm8u34qty- | head -1)
          echo "container=$cid"
          docker exec "$cid" node - <<'NODE'
          const url = (process.env.SUPABASE_UPSTREAM_URL || process.env.NEXT_PUBLIC_SUPABASE_URL || "").replace(/\/$/, "");
          const key = process.env.SUPABASE_SERVICE_ROLE_KEY || "";
          console.log("supabase_url", url ? url.slice(0, 40) : "(missing)", "key", Boolean(key));
          if (!url || !key) process.exit(1);
          const endpoint = url.includes("/sb") || url.includes("gwada")
            ? null
            : url;
          // Use Kong upstream if present
          const base = process.env.SUPABASE_UPSTREAM_URL || process.env.NEXT_PUBLIC_SUPABASE_URL;
          fetch(`${base.replace(/\/$/, "")}/rest/v1/waha_servers?select=id,name,base_url,docker_container_name,ssh_host,ssh_user,ssh_port,enabled`, {
            headers: { apikey: key, Authorization: `Bearer ${key}`, Accept: "application/json" },
          }).then(async (r) => {
            const t = await r.text();
            console.log("status", r.status);
            console.log(t.slice(0, 2000));
            if (!r.ok) process.exit(1);
          });
          NODE
          REMOTE
