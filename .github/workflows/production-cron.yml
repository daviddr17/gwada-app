name: Production cron jobs

on:
  schedule:
    # staff-shift-notifications, contact-inbox-sync, reservation-whatsapp/email
    - cron: "*/5 * * * *"
    # news-feed-sync, reviews-feed-sync
    - cron: "*/10 * * * *"
    # social-suggestions (weekly Autopilot queue)
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: Cron endpoint (schedule uses its own mapping)
        required: false
        type: choice
        default: all
        options:
          - all
          - news-feed-sync
          - reviews-feed-sync
          - staff-shift-notifications
          - contact-inbox-sync
          - accounting-lexoffice-sync
          - social-suggestions
          - reservation-whatsapp
          - reservation-email
          - waha-session-recover
  # Agent / one-shot (workflow_dispatch oft 403)
  repository_dispatch:
    types: [production-cron, production-cron-reservation-outbox]

env:
  CRON_BASE_URL: https://gwada.app

# Retry transient timeouts (WAHA/app cold). --retry-all-errors needs curl ≥7.71.
defaults:
  run:
    shell: bash

jobs:
  news-feed-sync:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'news-feed-sync')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *')
    steps:
      - name: Call news-feed-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 120 --retry 3 --retry-all-errors --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/news-feed-sync"

  reviews-feed-sync:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'reviews-feed-sync')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *')
    steps:
      - name: Call reviews-feed-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 120 --retry 3 --retry-all-errors --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/reviews-feed-sync"

  # notification-deliver lives only in notification-deliver-cron.yml (*/2) — avoid double load.

  staff-shift-notifications:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'staff-shift-notifications')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    steps:
      - name: Call staff-shift-notifications
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 120 --retry 3 --retry-all-errors --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/staff-shift-notifications"

  contact-inbox-sync:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'contact-inbox-sync')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    steps:
      - name: Call contact-inbox-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 120 --retry 3 --retry-all-errors --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/contact-inbox-sync"

  waha-session-recover:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'waha-session-recover')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    steps:
      - name: Call waha-session-recover
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 180 --retry 3 --retry-all-errors --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/waha-session-recover"

  accounting-lexoffice-sync:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'accounting-lexoffice-sync')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/10 * * * *')
    steps:
      - name: Call accounting-lexoffice-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 300 --retry 2 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/accounting-lexoffice-sync"

  social-suggestions:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'social-suggestions')) ||
      (github.event_name == 'schedule' && (github.event.schedule == '0 7 * * 1' || github.event.schedule == '*/10 * * * *'))
    steps:
      - name: Call social-suggestions
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 300 --retry 2 --retry-all-errors --retry-delay 10 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/social-suggestions"

  # Erinnerung + Danke/Bewertung (WhatsApp-Outbox)
  # Kein --retry-all-errors: Outbox-Send ist ohne Claim-Schutz nicht idempotent;
  # Claim (DB) + concurrency verhindern Doppelversand bei Overlap.
  reservation-whatsapp:
    runs-on: ubuntu-latest
    concurrency:
      group: production-cron-reservation-whatsapp
      cancel-in-progress: false
    if: |
      (github.event_name == 'repository_dispatch' && (github.event.action == 'production-cron' || github.event.action == 'production-cron-reservation-outbox')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'reservation-whatsapp')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    steps:
      - name: Call reservation-whatsapp
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          # Nur Connect-Retries — kein Full-Replay nach Timeout (würde sonst erneut senden).
          curl -sfS --max-time 120 --retry 2 --retry-connrefused --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/reservation-whatsapp"

  # Erinnerung + Danke/Bewertung (E-Mail-Outbox)
  reservation-email:
    runs-on: ubuntu-latest
    concurrency:
      group: production-cron-reservation-email
      cancel-in-progress: false
    if: |
      (github.event_name == 'repository_dispatch' && (github.event.action == 'production-cron' || github.event.action == 'production-cron-reservation-outbox')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'reservation-email')) ||
      (github.event_name == 'schedule' && github.event.schedule == '*/5 * * * *')
    steps:
      - name: Call reservation-email
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 120 --retry 2 --retry-connrefused --retry-delay 5 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/reservation-email"
