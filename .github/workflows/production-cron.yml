name: Production cron jobs

# Kein schedule — der Live-VPS taktet alle Crons (scripts/install-vps-critical-cron.sh).
# Dieser Workflow ist nur manueller Notfall / Agent-One-Shot.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Cron endpoint
        required: false
        type: choice
        default: all
        options:
          - all
          - news-feed-sync
          - reviews-feed-sync
          - staff-shift-notifications
          - contact-inbox-sync
          - accounting-lexoffice-sync
          - social-suggestions
          - reservation-whatsapp
          - reservation-email
          - reservation-whatsapp-slo
          - waha-session-recover
  repository_dispatch:
    types: [production-cron, production-cron-reservation-outbox]

env:
  CRON_BASE_URL: https://gwada.app

defaults:
  run:
    shell: bash

jobs:
  news-feed-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'news-feed-sync')
    steps:
      - name: Call news-feed-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET not set — skipped."
            exit 0
          fi
          curl -sfS --max-time 120 --retry 3 --retry-all-errors --retry-delay 8 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$CRON_BASE_URL/api/cron/news-feed-sync"

  reviews-feed-sync:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'reviews-feed-sync')
    steps:
