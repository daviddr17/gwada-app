name: Recover zurschlagd purchase orders live

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply recovery (default dry-run only)"
        required: false
        type: boolean
        default: false
  repository_dispatch:
    types: [recover-zurschlagd-purchase-orders-live]

concurrency:
  group: recover-zurschlagd-purchase-orders-live
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup SSH
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          if [ -z "${LIVE_SSH_KEY}" ] || [ -z "${LIVE_VPS_HOST}" ]; then
            echo "::error::LIVE_SSH_KEY / LIVE_VPS_HOST fehlen in GitHub Repository Secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${LIVE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${LIVE_VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Install psql
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client

      - name: Diagnose PO state (read-only SQL)
        env:
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
        run: |
          export GWADA_SSH_IDENTITY=~/.ssh/id_ed25519
          export GWADA_SSH_BATCH=1
          export LIVE_VPS_HOST
          bash scripts/run-live-sql-ci.sh scripts/diagnose-zurschlagd-purchase-orders-live.sql

      - name: Run recovery script (live Supabase env from app container)
        env:
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
        run: |
          set -euo pipefail
          cid="$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@${LIVE_VPS_HOST}" \
            "docker ps --format '{{.Names}}' | grep d3cg1b54arvue2tcm8u34qty- | head -1")"
          cid="${cid//$'\r'/}"
          echo "container=${cid}"
          LIVE_URL="$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@${LIVE_VPS_HOST}" \
            "docker exec ${cid} printenv SUPABASE_UPSTREAM_URL || docker exec ${cid} printenv NEXT_PUBLIC_SUPABASE_URL")"
          LIVE_KEY="$(ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes "root@${LIVE_VPS_HOST}" \
            "docker exec ${cid} printenv SUPABASE_SERVICE_ROLE_KEY")"
          LIVE_URL="${LIVE_URL//$'\r'/}"
          LIVE_KEY="${LIVE_KEY//$'\r'/}"
          export SUPABASE_UPSTREAM_URL="${LIVE_URL}"
          export SUPABASE_SERVICE_ROLE_KEY="${LIVE_KEY}"
          export GWADA_RESTAURANT_SLUG=zurschlagd
          ARGS=()
          if [ "${APPLY}" = "1" ]; then
            export GWADA_CONFIRM_LIVE_PO_RECOVERY=1
            ARGS+=(--apply)
          fi
          pnpm exec tsx scripts/recover-zurschlag-purchase-orders.ts "${ARGS[@]}"
