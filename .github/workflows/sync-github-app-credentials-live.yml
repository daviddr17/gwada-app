name: Sync GitHub App credentials live

on:
  workflow_dispatch:
  repository_dispatch:
    types: [sync-github-app-credentials-live]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Sync GitHub App credentials to VPS
        env:
          LIVE_SSH_KEY: ${{ secrets.LIVE_SSH_KEY }}
          LIVE_VPS_HOST: ${{ secrets.LIVE_VPS_HOST }}
          GITHUB_APP_ID: ${{ secrets.GWADA_GITHUB_APP_ID }}
          GITHUB_APP_INSTALLATION_ID: ${{ secrets.GWADA_GITHUB_APP_INSTALLATION_ID }}
          GITHUB_APP_PRIVATE_KEY: ${{ secrets.GWADA_GITHUB_APP_PRIVATE_KEY }}
        run: |
          if [ -z "${LIVE_SSH_KEY}" ] || [ -z "${LIVE_VPS_HOST}" ]; then
            echo "::error::LIVE_SSH_KEY / LIVE_VPS_HOST fehlen."
            exit 1
          fi
          if [ -z "${GITHUB_APP_ID}" ] || [ -z "${GITHUB_APP_INSTALLATION_ID}" ] || [ -z "${GITHUB_APP_PRIVATE_KEY}" ]; then
            echo "::error::GWADA_GITHUB_APP_ID / GWADA_GITHUB_APP_INSTALLATION_ID / GWADA_GITHUB_APP_PRIVATE_KEY fehlen in GitHub Repository Secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "${LIVE_SSH_KEY}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${LIVE_VPS_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          export GWADA_SSH_IDENTITY=~/.ssh/id_ed25519
          export GWADA_SSH_BATCH=1
          export LIVE_VPS_HOST
          export GITHUB_APP_ID
          export GITHUB_APP_INSTALLATION_ID
          export GITHUB_APP_PRIVATE_KEY
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-cryptography >/dev/null
          bash scripts/sync-github-app-credentials-live.sh
